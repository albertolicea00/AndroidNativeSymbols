plugins {
    id 'com.android.application'
}

android {
    namespace 'com.albertolicea00.nativesymbols'
    compileSdk 36

    defaultConfig {
        applicationId 'com.albertolicea00.nativesymbols'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def channel = variant.name
    def artifactName = "Native-Symbols-v${android.defaultConfig.versionName}-${channel}-build${android.defaultConfig.versionCode}"

    variant.outputs.each { output ->
        output.outputFileName.set("${artifactName}.apk")
    }

    def capitalizedVariant = channel.capitalize()
    def exportBundle = tasks.register("export${capitalizedVariant}Bundle") {
        doLast {
            def sourceBundle = layout.buildDirectory.file("outputs/bundle/${channel}/app-${channel}.aab").get().asFile
            def namedBundle = layout.buildDirectory.file("outputs/bundle/${channel}/${artifactName}.aab").get().asFile
            namedBundle.parentFile.mkdirs()
            sourceBundle.withInputStream { input ->
                namedBundle.withOutputStream { output -> output << input }
            }
        }
    }

    tasks.configureEach {
        if (name == "bundle${capitalizedVariant}") {
            finalizedBy(exportBundle)
        }
    }
}
